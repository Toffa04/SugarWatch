<div class="min-h-screen w-full flex items-center justify-center bg-gray-50">
  <div class="border-2 border-blue-400 border-solid rounded-xl p-6 w-[400px]">
    <mat-tab-group class="w-full">
      <mat-tab label="Login">
        <div class="flex flex-col items-center gap-4 p-4">
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Email</mat-label>
            <input matInput [formControl]="emailLogin" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" [formControl]="passwordLogin" />
            <button
              matIconButton
              matSuffix
              (click)="clickEvent($event)"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide()"
            >
              <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <button matButton="outlined" (click)="login()">Login</button>
        </div>
      </mat-tab>

      <mat-tab label="Sign in">
        <div class="flex flex-col items-center gap-4 p-4">
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Email</mat-label>
            <input matInput [formControl]="email" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Username</mat-label>
            <input matInput [formControl]="username" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" [formControl]="password" />
            <button
              matIconButton
              matSuffix
              (click)="clickEvent($event)"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide()"
            >
              <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Ruolo</mat-label>
            <mat-select [formControl]="role">
              <mat-option value="MEDIC">Medico</mat-option>
              <mat-option value="PATIENT">Paziente</mat-option>
            </mat-select>
          </mat-form-field>

          <button matButton="outlined" (click)="signIn()">Sign in</button>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
