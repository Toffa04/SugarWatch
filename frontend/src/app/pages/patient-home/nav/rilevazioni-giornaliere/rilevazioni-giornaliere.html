<div class="p-2">
  <button mat-raised-button (click)="aggiungiRilevazione()">
    <mat-icon>add</mat-icon>
    <a>Aggiungi una nuova rilevazione</a>
  </button>
</div>

<div>
  <table
    mat-table
    [dataSource]="dataRilevazioni"
    class="mat-shadow-2"
    matSort
    matSortActive="dateTime"
    matSortDirection="desc"
  >
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Azioni</th>
      <td mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          matTooltip="Modifica rilevazione"
          (click)="modificaRilevazione(element)"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="glycemiaLevel">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Livello glicemia (mg/dL)</th>
      <td mat-cell *matCellDef="let element">{{ element.glycemiaLevel }}</td>
    </ng-container>

    <ng-container matColumnDef="dateTime">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Data e ora</th>
      <td mat-cell *matCellDef="let element">{{ element.dateTime }}</td>
    </ng-container>

    <ng-container matColumnDef="beforeMeal">
      <th mat-header-cell *matHeaderCellDef>Quando</th>
      <td mat-cell *matCellDef="let element">
        @if (element.beforeMeal) {
          {{ 'Prima mangiato' }}
        } @else {
          {{ 'Dopo mangiato' }}
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="symptoms">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Eventuali sintomi</th>
      <td mat-cell *matCellDef="let element">{{ element.symptoms }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="absolute inset-x-0 bottom-0">
    <mat-paginator [pageSizeOptions]="[25, 50, 100]" [pageSize]="paginatorSize()"></mat-paginator>
  </div>
</div>
