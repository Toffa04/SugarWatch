<div class="p-2">
    <button mat-raised-button (click)="aggiungi()">
        <mat-icon>add</mat-icon>
        <a>Aggiungi</a>
    </button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-shadow-2">

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Azioni</th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button matTooltip="Modifica" (click)="modifica(element)">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrizione</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
    </ng-container>

    <ng-container matColumnDef="medicine">
        <th mat-header-cell *matHeaderCellDef>Farmaco</th>
        <td mat-cell *matCellDef="let element">{{ element.medicine }}</td>
    </ng-container>

    <ng-container matColumnDef="reason">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let element">{{ element.reason }}</td>
    </ng-container>

    <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef>Data inizio</th>
        <td mat-cell *matCellDef="let element">{{ element.startDate | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="endDate">
        <th mat-header-cell *matHeaderCellDef>Data fine</th>
        <td mat-cell *matCellDef="let element">
            @if (element.endDate) {
                {{ element.endDate | date: 'dd/MM/yyyy' }}
            } @else {
                <span class="text-green-600 font-medium">In corso</span>
            }
        </td>
    </ng-container>

    <ng-container matColumnDef="notes">
        <th mat-header-cell *matHeaderCellDef>Note</th>
        <td mat-cell *matCellDef="let element">{{ element.notes }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
