<div class="p-2">
    <button mat-raised-button (click)="aggiungiTerapia()">
        <mat-icon>add</mat-icon>
        <a>Aggiungi un nuovo farmaco</a>
    </button>
</div>

<div>
    <table
        mat-table
        [dataSource]="dataAssunzioni"
        class="mat-shadow-2"
        matSort
        matSortActive="dateTime"
        matSortDirection="desc"
    >
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Azioni</th>
            <td mat-cell *matCellDef="let element">
                <button
                    mat-icon-button
                    matToolTip="Modifica Terapia"
                    (click)="modificaTerapia(element)"
                >
                    <mat-icon>edit</mat-icon>
                </button>
            </td>
        </ng-container>

        <ng-container matColumnDef="therapy">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Terapia</th>
            <td mat-cell *matCellDef="let element">{{ element.therapy?.medicine }}</td>
        </ng-container>

        <ng-container matColumnDef="matchesTherapy">
            <th mat-header-cell *matHeaderCellDef>Conforme</th>
            <td mat-cell *matCellDef="let element">
                @if (element.matchesTherapy){
                    <mat-icon class="text-green-600">check_circle</mat-icon>
                } @else {
                    <mat-icon class="text-red-600">cancel</mat-icon>
                }
            </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantita'</th>
            <td mat-cell *matCellDef="let element">{{ element.quantity }}</td>
        </ng-container>

        <ng-container matColumnDef="dateTime">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Data e ora</th>
            <td mat-cell *matCellDef="let element">{{ element.dateTime | date: 'dd/MM/yyyy HH:mm' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
    </table>

    <div class="absolute inset-x-0 bottom-0">
        <mat-paginator [pageSizeOptions]="[25, 50, 100]" [pageSize]="paginatorSize()"></mat-paginator>
    </div>
</div>
