<div>
  <table mat-table [dataSource]="dataPazienti" class="mat-shadow-2" matSort>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Azioni</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button matTooltip="Visualizza rilevazioni" (click)="visualizzaRilevazioni(element)">
          <mat-icon>visibility</mat-icon>
        </button>

        <button mat-icon-button matTooltip="Modifica dati" (click)="modificaDati(element)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
      <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cognome</th>
      <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="birthDate">
      <th mat-header-cell *matHeaderCellDef>Data di nascita</th>
      <td mat-cell *matCellDef="let element">{{ element.birthDate }}</td>
    </ng-container>

    <ng-container matColumnDef="medicalHistory">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Storia medica</th>
      <td mat-cell *matCellDef="let element">{{ element.medicalHistory }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="absolute inset-x-0 bottom-0">
    <mat-paginator [pageSizeOptions]="[25, 50, 100]" [pageSize]="paginatorSize()"></mat-paginator>
  </div>
</div>
