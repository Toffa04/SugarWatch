<table mat-table [dataSource]="dataPendingUser" class="mat-shadow-2">
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Azioni</th>
    <td mat-cell *matCellDef="let element">
      @if (element.verified === false) {
        <button mat-icon-button matTooltip="Verifica utente" (click)="verifica(element)">
          <mat-icon>check</mat-icon>
        </button>
      }

      @if (element.role != 'ADMIN') {
        <button mat-icon-button matTooltip="Modifica utente" (click)="modifica(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Elimina utente" (click)="elimina(element)">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Id</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Username</th>
    <td mat-cell *matCellDef="let element">{{ element.username }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let element">{{ element.email }}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Ruolo</th>
    <td mat-cell *matCellDef="let element">{{ element.role }}</td>
  </ng-container>

  <ng-container matColumnDef="verified">
    <th mat-header-cell *matHeaderCellDef>Verificato</th>
    <td mat-cell *matCellDef="let element">
      <mat-icon [color]="element.verified ? 'primary' : 'warn'">
        {{ element.verified ? 'check_circle' : 'cancel' }}
      </mat-icon>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
